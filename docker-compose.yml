version: '3.8'

services:
  # PostgreSQL 16 + pgvector for Relational Data & AI Vector Embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: frame_postgres
    restart: always
    environment:
      POSTGRES_DB: cineplay_db
      POSTGRES_USER: cineplay_user
      POSTGRES_PASSWORD: cineplay_secret_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cineplay_user -d cineplay_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 for Transcoding Job Queue & WebSocket Adapter
  redis:
    image: redis:7-alpine
    container_name: frame_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # MinIO S3-Compatible Object Storage for Large Video Assets
  minio:
    image: minio/minio:RELEASE.2024-03-15T20-13-16Z
    container_name: frame_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    ports:
      - '9000:9000' # S3 API Port
      - '9001:9001' # MinIO Web Console
    volumes:
      - minio_data:/data

  # Backend API & Transcoder Queue Worker
  api:
    build:
      context: .
      dockerfile: server/Dockerfile.backend
    container_name: frame_api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cineplay_user:cineplay_secret_password@postgres:5432/cineplay_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cineplay-media
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_secret_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
